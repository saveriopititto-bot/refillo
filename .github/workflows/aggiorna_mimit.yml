name: Aggiorna Dati MIMIT

# Ogni mattina scarica i CSV MIMIT (anagrafica e prezzi alle 8) e li salva compressi nel branch `dati`
# (mimit/*.csv.gz): l'app li scarica da lì, se sono di oggi, invece che dal sito del ministero.
# Non scrive mai su main.
on:
  schedule:
    # 07:05 UTC (8:05 solare / 9:05 legale in Italia, dopo le 8:00 MIMIT), più due riprove: GitHub a volte avvia
    # le azioni programmate con ore di ritardo o le salta; se i file non sono cambiati non si salva niente
    - cron: "05 7 * * *"
    - cron: "35 9 * * *"
    - cron: "05 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dati  # lo stesso di storico.yml: un solo workflow alla volta scrive nel branch dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa le dipendenze
        run: pip install -r requirements.txt
      - name: Prepara il branch dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dati > /dev/null; then
            git fetch --depth 1 origin dati
            git worktree add dati-wt FETCH_HEAD
            git -C dati-wt switch -c dati
          else
            git worktree add --detach dati-wt
            git -C dati-wt switch --orphan dati
          fi
      - name: Scarica i dati MIMIT
        run: python scripts/aggiorna_mimit.py --dest dati-wt/mimit
      - name: Salva nel branch dati
        working-directory: dati-wt
        run: |
          git add mimit
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati MIMIT."
          else
            git commit -m "Dati MIMIT: $(date -u +%Y-%m-%d)"
            git push origin dati
          fi
